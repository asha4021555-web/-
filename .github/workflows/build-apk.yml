      - name: Configure Android permissions for prayer reminders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for permission in [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.INTERNET',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
              'android.permission.WAKE_LOCK',
          ]:
              if permission not in s:
                  tag = '<uses-permission android:name="{}"/>'.format(permission)
                  s = s.replace('<application', tag + '\n    <application', 1)
          receivers = '''
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receivers + '\n</application>', 1)
          adhan_components = '''
              <receiver android:name=".AdhanAlarmReceiver" android:enabled="true" android:exported="false" />
              <service android:name=".AdhanPlaybackService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaPlayback" />
          '''
          if 'AdhanAlarmReceiver' not in s:
              s = s.replace('</application>', adhan_components + '\n</application>', 1)
          p.write_text(s)

          import re
          gradle_files = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next(x for x in gradle_files if x.exists()).read_text()
          match = re.search(r'namespace\s*=\s*"([^"]+)"', gradle)
          if not match:
              raise SystemExit('Could not determine Android namespace for adhan service')
          package = match.group(1)
          source = Path('android/app/src/main/kotlin') / Path(*package.split('.'))
          source.mkdir(parents=True, exist_ok=True)
          main_activity = source / 'MainActivity.kt'
          main_activity.write_text(f'''package {package}

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {{
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "noor_adhan_background")
                      .setMethodCallHandler {{ call, result ->
                          when (call.method) {{
                              "scheduleAdhan" -> {{
                                  try {{
                                      val times = call.argument<List<Number>>("times") ?: emptyList()
                                      val audioPath = call.argument<String>("audioPath")
                                      val volume = (call.argument<Double>("volume") ?: 1.0).toFloat().coerceIn(0f, 1f)
                                      val iqamaAudioPath = call.argument<String>("iqamaAudioPath")
                                      val iqamaTimes = call.argument<List<Number>>("iqamaTimes") ?: emptyList()
                                      val manager = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                                      for (id in 4100..4134) {{
                                          val old = PendingIntent.getBroadcast(this, id, Intent(this, AdhanAlarmReceiver::class.java), PendingIntent.FLAG_NO_CREATE or PendingIntent.FLAG_IMMUTABLE)
                                          if (old != null) manager.cancel(old)
                                      }}
                                      for (id in 4200..4234) {{
                                          val old = PendingIntent.getBroadcast(this, id, Intent(this, AdhanAlarmReceiver::class.java), PendingIntent.FLAG_NO_CREATE or PendingIntent.FLAG_IMMUTABLE)
                                          if (old != null) manager.cancel(old)
                                      }}
                                      if (!audioPath.isNullOrBlank()) {{
                                          times.forEachIndexed {{ index, timestamp ->
                                              val intent = Intent(this, AdhanAlarmReceiver::class.java).putExtra("audio_path", audioPath).putExtra("volume", volume)
                                              val pending = PendingIntent.getBroadcast(this, 4100 + index, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                                              if (timestamp.toLong() > System.currentTimeMillis()) {{
                                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) manager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timestamp.toLong(), pending)
                                                  else manager.setExact(AlarmManager.RTC_WAKEUP, timestamp.toLong(), pending)
                                              }}
                                          }}
                                      }}
                                      if (!iqamaAudioPath.isNullOrBlank()) {{
                                          iqamaTimes.forEachIndexed {{ index, timestamp ->
                                              val intent = Intent(this, AdhanAlarmReceiver::class.java).putExtra("audio_path", iqamaAudioPath)
                                              val pending = PendingIntent.getBroadcast(this, 4200 + index, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                                              if (timestamp.toLong() > System.currentTimeMillis()) {{
                                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) manager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timestamp.toLong(), pending)
                                                  else manager.setExact(AlarmManager.RTC_WAKEUP, timestamp.toLong(), pending)
                                              }}
                                          }}
                                      }}
                                      result.success(true)
                                  }} catch (error: Exception) {{ result.error("ADHAN_SCHEDULE", error.message, null) }}
                              }}
                              "setPlaybackVolume" -> {{
                                  val volume = (call.argument<Double>("volume") ?: 1.0).toFloat().coerceIn(0f, 1f)
                                  startService(Intent(this, AdhanPlaybackService::class.java)
                                      .setAction("com.nooralislam.SET_VOLUME")
                                      .putExtra("volume", volume))
                                  result.success(true)
                              }}
                              "stopPlayback" -> {{
                                  stopService(Intent(this, AdhanPlaybackService::class.java))
                                  result.success(true)
                              }}
                              "cancelAdhan" -> {{
                                  val manager = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                                  for (id in 4100..4134) {{
                                      val old = PendingIntent.getBroadcast(this, id, Intent(this, AdhanAlarmReceiver::class.java), PendingIntent.FLAG_NO_CREATE or PendingIntent.FLAG_IMMUTABLE)
                                      if (old != null) manager.cancel(old)
                                  }}
                                  for (id in 4200..4234) {{
                                      val old = PendingIntent.getBroadcast(this, id, Intent(this, AdhanAlarmReceiver::class.java), PendingIntent.FLAG_NO_CREATE or PendingIntent.FLAG_IMMUTABLE)
                                      if (old != null) manager.cancel(old)
                                  }}
                                  result.success(true)
                              }}
                              else -> result.notImplemented()
                          }}
                      }}
              }}
          }}
          ''')
          (source / 'AdhanAlarmReceiver.kt').write_text(f'''package {package}

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class AdhanAlarmReceiver : BroadcastReceiver() {{
              override fun onReceive(context: Context, intent: Intent) {{
                  val path = intent.getStringExtra("audio_path") ?: return
                  val service = Intent(context, AdhanPlaybackService::class.java).putExtra("audio_path", path).putExtra("volume", intent.getFloatExtra("volume", 1f))
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(service)
                  else context.startService(service)
              }}
          }}
          ''')
          (source / 'AdhanPlaybackService.kt').write_text(f'''package {package}

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat

          class AdhanPlaybackService : Service() {{
              private var player: MediaPlayer? = null
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {{
                  if (intent?.action == "com.nooralislam.SET_VOLUME") {{
                      val newVolume = (intent.getFloatExtra("volume", 1f)).coerceIn(0f, 1f)
                      val currentPlayer = player
                      if (currentPlayer != null) {{
                          try {{ currentPlayer.setVolume(newVolume, newVolume) }} catch (_: IllegalStateException) {{ }}
                      }} else {{
                          stopSelf(startId)
                      }}
                      return START_NOT_STICKY
                  }}
                  if (intent?.action == "com.nooralislam.STOP_ADHAN") {{
                      player?.stop()
                      player?.release()
                      player = null
                      stopForeground(true)
                      stopSelf(startId)
                      return START_NOT_STICKY
                  }}
                  val path = intent?.getStringExtra("audio_path")
                  val volume = (intent?.getFloatExtra("volume", 1f) ?: 1f).coerceIn(0f, 1f)
                  if (path.isNullOrBlank()) {{ stopSelf(startId); return START_NOT_STICKY }}
                  createChannel()
                  val stopIntent = Intent(this, AdhanPlaybackService::class.java).setAction("com.nooralislam.STOP_ADHAN")
                  val stopPendingIntent = PendingIntent.getService(this, 7302, stopIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val notification: Notification = NotificationCompat.Builder(this, "noor_adhan_playback")
                      .setSmallIcon(applicationInfo.icon)
                      .setContentTitle("نور الإسلام")
                      .setContentText("يُشغّل الأذان الآن")
                      .addAction(0, "إيقاف الأذان", stopPendingIntent)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()
                  startForeground(7301, notification)
                  try {{
                      player?.release()
                      player = MediaPlayer().apply {{
                          setAudioAttributes(AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build())
                          setWakeMode(applicationContext, android.os.PowerManager.PARTIAL_WAKE_LOCK)
                          setDataSource(path)
                          setVolume(volume, volume)
                          setOnPreparedListener {{ it.start() }}
                          setOnCompletionListener {{ stopSelf(startId) }}
                          setOnErrorListener {{ _, _, _ -> stopSelf(startId); true }}
                          prepareAsync()
                      }}
                  }} catch (error: Exception) {{
                      stopSelf(startId)
                  }}
                  return START_NOT_STICKY
              }}

              private fun createChannel() {{
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {{
                      val channel = NotificationChannel("noor_adhan_playback", "تشغيل الأذان", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }}
              }}

              override fun onDestroy() {{
                  player?.release()
                  player = null
                  super.onDestroy()
              }}
          }}
          ''')
          print('Installed native Android exact-alarm receiver and foreground adhan audio service.')
          PY

      - name: Bundle 1000 verified Sahih hadiths
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://github.com/Jaguar16/open-hadith-data/releases/download/v1.1.0/collections-json.zip \
            --output /tmp/open-hadith-data.zip
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          wanted = {'bukhari': [], 'muslim': []}
          with zipfile.ZipFile('/tmp/open-hadith-data.zip') as archive:
              for name in archive.namelist():
                  if not name.lower().endswith('.json'):
                      continue
                  try:
                      data = json.loads(archive.read(name))
                  except Exception:
                      continue
                  collection = (data.get('collection') or {}).get('id')
                  if collection not in wanted:
                      stem = Path(name).stem.lower()
                      collection = stem if stem in wanted else None
                  if collection not in wanted:
                      continue
                  records = []
                  for book in data.get('books', []):
                      records.extend(book.get('hadiths', []))
                  records.extend(data.get('hadiths', []))
                  if records and len(records) > len(wanted[collection]):
                      wanted[collection] = records

          output = []
          for collection, limit, arabic_name in [
              ('bukhari', 700, 'صحيح البخاري'),
              ('muslim', 300, 'صحيح مسلم'),
          ]:
              records = wanted[collection]
              usable = [h for h in records if (h.get('text_ar') or '').strip()]
              if len(usable) < limit:
                  raise SystemExit(f'Not enough Arabic hadiths in {collection}: {len(usable)}')
              for h in usable[:limit]:
                  number = str(h.get('hadith_number') or '')
                  output.append({
                      'reference': h.get('reference') or f'{arabic_name} {number}',
                      'text_ar': h['text_ar'].strip(),
                      'source': arabic_name,
                      'grade': h.get('grade_ar') or 'صحيح بالإدراج في الصحيح',
                      'url_source': h.get('url_source') or '',
                  })

          if len(output) != 1000:
              raise SystemExit(f'Expected exactly 1000 hadiths, got {len(output)}')
          Path('assets/hadiths-1000.json').write_text(
              json.dumps(output, ensure_ascii=False), encoding='utf-8')
          print('Bundled exactly', len(output), 'full Arabic Sahih hadiths.')
          PY

