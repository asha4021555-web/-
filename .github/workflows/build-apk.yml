name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.nooralislam .

      - name: Bundle the complete verified Uthmani Quran text
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/nurekella/namaz-times-kz/main/quran/ar.txt \
            --output assets/quran-uthmani.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('assets/quran-uthmani.txt').read_text(encoding='utf-8')
          lines = text.splitlines()
          if len(lines) != 6236 or any('|' in line for line in lines):
              raise SystemExit(f'Invalid Quran asset: {len(lines)} lines')
          print('Verified bundled Quran:', len(lines), 'ayahs')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart code
        run: flutter analyze --no-fatal-infos lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-islam-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
