name: Build Noor Al-Islam APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: noor-al-islam-android-build-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.nooralislam .


      - name: Add Android home screen widgets
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          activity_start = xml.find('<activity')
          activity_end = xml.find('</activity>', activity_start)
          if activity_start < 0 or activity_end < 0:
              raise SystemExit('MainActivity block was not found in AndroidManifest.xml')
          activity = xml[activity_start:activity_end]
          launch_filter = '''
                  <intent-filter>
                      <action android:name="es.antonborri.home_widget.action.LAUNCH" />
                      <category android:name="android.intent.category.DEFAULT" />
                  </intent-filter>
          '''
          if 'es.antonborri.home_widget.action.LAUNCH' not in activity:
              xml = xml[:activity_end] + launch_filter + xml[activity_end:]

          receivers = '''
              <receiver android:name=".NoorAdhkarWidgetProvider" android:label="أذكار نور الإسلام" android:exported="true">
                  <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/noor_adhkar_widget_info" />
              </receiver>
              <receiver android:name=".NoorTasbeehWidgetProvider" android:label="السبحة الإلكترونية" android:exported="true">
                  <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/noor_tasbeeh_widget_info" />
              </receiver>
              <receiver android:name=".QuranMajeedWidgetProvider" android:label="قرآن مجيد" android:exported="true">
                  <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/quran_majeed_widget_info" />
              </receiver>
              <receiver android:name=".QuranKareemWidgetProvider" android:label="القرآن الكريم" android:exported="true">
                  <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/quran_kareem_widget_info" />
              </receiver>
              <receiver android:name=".PrayerTimesWidgetProvider" android:label="مواقيت الصلاة" android:exported="true">
                  <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/prayer_times_widget_info" />
              </receiver>
          '''
          if 'NoorAdhkarWidgetProvider' not in xml:
              xml = xml.replace('</application>', receivers + '\n</application>', 1)
          manifest.write_text(xml)

          gradle_files = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next(p for p in gradle_files if p.exists()).read_text()
          match = re.search(r'namespace\s*=\s*"([^"]+)"', gradle)
          if not match:
              match = re.search(r'namespace\s+"([^"]+)"', gradle)
          if not match:
              raise SystemExit('Could not determine Android namespace for widgets')
          package = match.group(1)
          source = Path('android/app/src/main/kotlin') / Path(*package.split('.'))
          source.mkdir(parents=True, exist_ok=True)
          (source / 'NoorHomeWidgets.kt').write_text(f'''package {package}

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.graphics.Color
          import android.view.View
          import android.util.TypedValue
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetLaunchIntent
          import es.antonborri.home_widget.HomeWidgetPlugin

          abstract class NoorBaseWidget : AppWidgetProvider() {{
              abstract val title: String
              abstract val subtitle: String
              abstract val target: String

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {{
                  ids.forEach {{ id ->
                      val views = RemoteViews(context.packageName, R.layout.noor_home_widget)
                      val darkMode = HomeWidgetPlugin.getData(context).getBoolean("dark_mode", false)
                      views.setInt(R.id.widget_root, "setBackgroundResource",
                          if (darkMode) R.drawable.noor_widget_background_dark else R.drawable.noor_widget_background)
                      val titleColor = if (darkMode) Color.WHITE else Color.rgb(73, 51, 38)
                      val subtitleColor = if (darkMode) Color.LTGRAY else Color.rgb(102, 85, 72)
                      views.setTextColor(R.id.widget_title, titleColor)
                      views.setTextColor(R.id.widget_subtitle, subtitleColor)
                      views.setTextViewText(R.id.widget_title, title)
                      views.setTextViewText(R.id.widget_subtitle, subtitle)
                      views.setViewVisibility(R.id.widget_count, View.GONE)
                      views.setViewVisibility(R.id.widget_action, View.GONE)
                      views.setOnClickPendingIntent(R.id.widget_root, HomeWidgetLaunchIntent.getActivity(context, MainActivity::class.java, Uri.parse("nooralislam://$target")))
                      manager.updateAppWidget(id, views)
                  }}
              }}
          }}

          class NoorAdhkarWidgetProvider : NoorBaseWidget() {{
              override val title = "أذكار نور الإسلام"
              override val subtitle = "أذكار الصباح والمساء • اضغط للفتح"
              override val target = "adhkar"
          }}

          class QuranMajeedWidgetProvider : NoorBaseWidget() {{
              override val title = "قرآن مجيد"
              override val subtitle = "افتح المصحف بالصفحات المصوّرة مباشرة"
              override val target = "quran-majeed"
          }}

          class QuranKareemWidgetProvider : NoorBaseWidget() {{
              override val title = "القرآن الكريم"
              override val subtitle = "افتح القراءة النصية مباشرة من سورة الفاتحة"
              override val target = "quran-kareem"
          }}

          class NoorTasbeehWidgetProvider : AppWidgetProvider() {{
              companion object {{ const val ACTION_INCREMENT = "{package}.TASBEEH_INCREMENT" }}

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {{
                  ids.forEach {{ id -> render(context, manager, id) }}
              }}

              private fun render(context: Context, manager: AppWidgetManager, id: Int) {{
                  val count = context.getSharedPreferences("noor_widget_data", Context.MODE_PRIVATE).getInt("tasbeeh_count", 0)
                  val darkMode = HomeWidgetPlugin.getData(context).getBoolean("dark_mode", false)
                  val views = RemoteViews(context.packageName, R.layout.noor_home_widget)
                  views.setInt(R.id.widget_root, "setBackgroundResource",
                      if (darkMode) R.drawable.noor_widget_background_dark else R.drawable.noor_widget_background)
                  val titleColor = if (darkMode) Color.WHITE else Color.rgb(73, 51, 38)
                  val subtitleColor = if (darkMode) Color.LTGRAY else Color.rgb(102, 85, 72)
                  views.setTextColor(R.id.widget_title, titleColor)
                  views.setTextColor(R.id.widget_subtitle, subtitleColor)
                  views.setTextColor(R.id.widget_count, titleColor)
                  views.setTextColor(R.id.widget_action, titleColor)
                  views.setTextViewText(R.id.widget_title, "السبحة الإلكترونية")
                  views.setTextViewText(R.id.widget_subtitle, "عداد التسبيح من الشاشة الرئيسية")
                  views.setTextViewText(R.id.widget_count, count.toString())
                  views.setViewVisibility(R.id.widget_count, View.VISIBLE)
                  views.setViewVisibility(R.id.widget_action, View.VISIBLE)
                  views.setTextViewText(R.id.widget_action, "سبّح +١")
                  val increment = Intent(context, NoorTasbeehWidgetProvider::class.java).setAction(ACTION_INCREMENT)
                  val pending = PendingIntent.getBroadcast(context, id, increment, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  views.setOnClickPendingIntent(R.id.widget_action, pending)
                  views.setOnClickPendingIntent(R.id.widget_root, HomeWidgetLaunchIntent.getActivity(context, MainActivity::class.java, Uri.parse("nooralislam://tasbeeh")))
                  manager.updateAppWidget(id, views)
              }}

              override fun onReceive(context: Context, intent: Intent) {{
                  if (intent.action == ACTION_INCREMENT) {{
                      val prefs = context.getSharedPreferences("noor_widget_data", Context.MODE_PRIVATE)
                      prefs.edit().putInt("tasbeeh_count", prefs.getInt("tasbeeh_count", 0) + 1).apply()
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, NoorTasbeehWidgetProvider::class.java))
                      onUpdate(context, manager, ids)
                  }} else super.onReceive(context, intent)
              }}
          }}
          ''')

          (source / 'PrayerTimesWidgetProvider.kt').write_text('''package __PACKAGE__

          import android.appwidget.AppWidgetManager          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.graphics.Color
          import android.net.Uri
          import android.os.SystemClock
          import android.view.View
          import android.util.TypedValue
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetLaunchIntent
          import es.antonborri.home_widget.HomeWidgetPlugin
          import java.util.Calendar

          class PrayerTimesWidgetProvider : AppWidgetProvider() {
              private val keys = listOf("fajr", "dhuhr", "asr", "maghrib", "isha")
              private val names = listOf("الفجر", "الظهر", "العصر", "المغرب", "العشاء")
              private val viewIds = listOf(R.id.prayer_fajr, R.id.prayer_dhuhr, R.id.prayer_asr, R.id.prayer_maghrib, R.id.prayer_isha)

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  ids.forEach { render(context, manager, it) }
              }

              override fun onAppWidgetOptionsChanged(context: Context, manager: AppWidgetManager, appWidgetId: Int, newOptions: android.os.Bundle) {
                  super.onAppWidgetOptionsChanged(context, manager, appWidgetId, newOptions)
                  render(context, manager, appWidgetId)
              }

              private fun render(context: Context, manager: AppWidgetManager, id: Int) {
                  val data = HomeWidgetPlugin.getData(context)
                  val views = RemoteViews(context.packageName, R.layout.noor_prayer_widget)
                  // Prayer widget keeps its dark appearance in both app themes.
                  views.setInt(R.id.prayer_widget_root, "setBackgroundResource", R.drawable.noor_widget_background_dark)
                  val mainTextColor = Color.WHITE
                  val secondaryTextColor = Color.LTGRAY
                  listOf(R.id.prayer_fajr_label, R.id.prayer_dhuhr_label, R.id.prayer_asr_label,
                      R.id.prayer_maghrib_label, R.id.prayer_isha_label).forEach {
                      views.setTextColor(it, secondaryTextColor)
                  }
                  viewIds.forEach { views.setTextColor(it, mainTextColor) }
                  views.setTextColor(R.id.prayer_countdown_label, secondaryTextColor)
                  views.setTextColor(R.id.prayer_countdown, mainTextColor)
                  views.setTextColor(R.id.prayer_hijri, secondaryTextColor)
                  val hijriOffset = data.getInt("hijri_offset", 0)
                  val hijriFormatter = android.icu.text.SimpleDateFormat(
                      "d MMM yyyy 'هـ'", android.icu.util.ULocale("ar-SA@calendar=islamic-umalqura"))
                  val hijriDate = hijriFormatter.format(java.util.Date(System.currentTimeMillis() + hijriOffset * 86400000L))
                  views.setTextViewText(R.id.prayer_hijri, hijriDate)
                  val now = System.currentTimeMillis()
                  val calendar = Calendar.getInstance()
                  calendar.set(Calendar.HOUR_OF_DAY, 0)
                  calendar.set(Calendar.MINUTE, 0)
                  calendar.set(Calendar.SECOND, 0)
                  calendar.set(Calendar.MILLISECOND, 0)
                  val todayStart = calendar.timeInMillis
                  val todayIndex = (0..6).firstOrNull { (data.getString("prayer_day_${it}_date_epoch", "-1")?.toLongOrNull() ?: -1L) == todayStart } ?: 0

                  keys.forEachIndexed { index, key ->
                      val value = data.getString("prayer_day_${todayIndex}_${key}", null)
                          ?: data.getString("prayer_${key}", "--:--")
                      views.setTextViewText(viewIds[index], value)
                  }

                  var nextIndex = -1
                  var nextTime = 0L
                  for (day in todayIndex..6) {
                      for (index in keys.indices) {
                          val timestamp = (data.getString("prayer_day_${day}_${keys[index]}_epoch", "0")?.toLongOrNull() ?: 0L)
                          if (timestamp > now) {
                              nextIndex = index
                              nextTime = timestamp
                              break
                          }
                      }
                      if (nextTime > 0L) break
                  }

                  val widgetOptions = manager.getAppWidgetOptions(id)
                  val expanded = widgetOptions.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 64) >= 78
                  val compact = widgetOptions.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 240) < 280
                  views.setTextViewTextSize(R.id.prayer_hijri, TypedValue.COMPLEX_UNIT_SP, if (compact) 7f else 8f)
                  listOf(R.id.prayer_fajr_label, R.id.prayer_dhuhr_label, R.id.prayer_asr_label,
                      R.id.prayer_maghrib_label, R.id.prayer_isha_label).forEach {
                      views.setTextViewTextSize(it, TypedValue.COMPLEX_UNIT_SP, if (compact) 8f else 9f)
                  }
                  viewIds.forEach {
                      views.setTextViewTextSize(it, TypedValue.COMPLEX_UNIT_SP, if (compact) 9f else 10f)
                  }
                  if (nextTime > now && nextIndex >= 0) {
                      views.setViewVisibility(R.id.prayer_countdown_label, View.VISIBLE)
                      views.setViewVisibility(R.id.prayer_countdown, View.VISIBLE)
                      views.setTextViewText(R.id.prayer_countdown_label, "المتبقي على صلاة " + names[nextIndex])
                      views.setTextViewTextSize(R.id.prayer_countdown_label, TypedValue.COMPLEX_UNIT_SP, if (expanded) 12f else 8f)
                      views.setTextViewTextSize(R.id.prayer_countdown, TypedValue.COMPLEX_UNIT_SP, if (expanded) 15f else 10f)
                      views.setChronometer(R.id.prayer_countdown, SystemClock.elapsedRealtime() + (nextTime - now), null, true)
                      views.setChronometerCountDown(R.id.prayer_countdown, true)
                  } else {
                      views.setViewVisibility(R.id.prayer_countdown_label, View.GONE)
                      views.setViewVisibility(R.id.prayer_countdown, View.GONE)
                  }

                  views.setOnClickPendingIntent(R.id.prayer_widget_root, HomeWidgetLaunchIntent.getActivity(context, MainActivity::class.java, Uri.parse("nooralislam://quran-kareem")))
                  manager.updateAppWidget(id, views)
              }
          }
          '''.replace('__PACKAGE__', package))

          res = Path('android/app/src/main/res')
          (res / 'layout').mkdir(parents=True, exist_ok=True)
          (res / 'xml').mkdir(parents=True, exist_ok=True)
          (res / 'drawable').mkdir(parents=True, exist_ok=True)
          (res / 'drawable/noor_widget_background.xml').write_text('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#FFF9F0"/><corners android:radius="18dp"/><stroke android:width="1dp" android:color="#D8C39A"/></shape>''')
          (res / 'drawable/noor_widget_background_dark.xml').write_text('''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#000000"/><corners android:radius="18dp"/><stroke android:width="1dp" android:color="#333333"/></shape>''')
          (res / 'layout/noor_prayer_widget.xml').write_text('''<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/prayer_widget_root" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="2dp" android:background="@drawable/noor_widget_background_dark"><TextView android:id="@+id/prayer_hijri" android:layout_width="match_parent" android:layout_height="12dp" android:gravity="center" android:text="التاريخ الهجري" android:textColor="#DDDDDD" android:textSize="8sp" android:singleLine="true"/><LinearLayout android:layout_width="match_parent" android:layout_height="32dp" android:orientation="horizontal" android:gravity="center"><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/prayer_fajr_label" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="الفجر" android:textColor="#BBBBBB" android:textSize="9sp"/><TextView android:id="@+id/prayer_fajr" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="--:--" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/prayer_dhuhr_label" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="الظهر" android:textColor="#BBBBBB" android:textSize="9sp"/><TextView android:id="@+id/prayer_dhuhr" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="--:--" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/prayer_asr_label" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="العصر" android:textColor="#BBBBBB" android:textSize="9sp"/><TextView android:id="@+id/prayer_asr" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="--:--" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/prayer_maghrib_label" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="المغرب" android:textColor="#BBBBBB" android:textSize="9sp"/><TextView android:id="@+id/prayer_maghrib" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="--:--" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/prayer_isha_label" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="العشاء" android:textColor="#BBBBBB" android:textSize="9sp"/><TextView android:id="@+id/prayer_isha" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="--:--" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp"/></LinearLayout></LinearLayout><LinearLayout android:id="@+id/prayer_countdown_row" android:layout_width="match_parent" android:layout_height="16dp" android:gravity="center" android:layoutDirection="ltr" android:orientation="horizontal"><TextView android:id="@+id/prayer_countdown_label" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textDirection="rtl" android:text="المتبقي على الصلاة" android:textColor="#BBBBBB" android:textSize="8sp" android:visibility="gone"/><Chronometer android:id="@+id/prayer_countdown" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="5dp" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="10sp" android:visibility="gone"/></LinearLayout></LinearLayout>''')

          (res / 'layout/noor_home_widget.xml').write_text('''<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/widget_root" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="12dp" android:background="@drawable/noor_widget_background"><TextView android:id="@+id/widget_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center" android:text="نور الإسلام" android:textColor="#493326" android:textStyle="bold" android:textSize="17sp"/><TextView android:id="@+id/widget_subtitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center" android:layout_marginTop="5dp" android:text="اضغط للفتح" android:textColor="#665548" android:textSize="12sp"/><TextView android:id="@+id/widget_count" android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center" android:layout_marginTop="4dp" android:text="0" android:textColor="#493326" android:textStyle="bold" android:textSize="22sp" android:visibility="gone"/><Button android:id="@+id/widget_action" android:layout_width="wrap_content" android:layout_height="38dp" android:layout_marginTop="4dp" android:text="سبّح +١" android:visibility="gone"/></LinearLayout>''')
          configs = {
              'noor_adhkar_widget_info': ('أذكار نور الإسلام', '2', '1'),
              'noor_tasbeeh_widget_info': ('السبحة الإلكترونية', '2', '1'),
              'quran_majeed_widget_info': ('قرآن مجيد', '2', '1'),
              'quran_kareem_widget_info': ('القرآن الكريم', '2', '1'),
              'prayer_times_widget_info': ('مواقيت الصلاة', '5', '1'),
          }
          for name, (label, width, height) in configs.items():
              is_prayer = name == 'prayer_times_widget_info'
              layout_name = 'noor_prayer_widget' if is_prayer else 'noor_home_widget'
              min_width = '240dp' if is_prayer else '110dp'
              min_height = '64dp' if is_prayer else '70dp'
              refresh = '1800000' if is_prayer else '0'
              resize = ' android:minResizeWidth="190dp" android:minResizeHeight="50dp"' if is_prayer else ''
              (res / f'xml/{name}.xml').write_text(f'''<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="{min_width}" android:minHeight="{min_height}"{resize} android:initialLayout="@layout/{layout_name}" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen" android:updatePeriodMillis="{refresh}" />''')
          print('Created five Android home-screen widgets: adhkar, tasbeeh counter, Quran Majeed, Quran Kareem, and prayer times.')
          PY

      - name: Enable Java API desugaring for scheduled notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')
          p = kts if kts.exists() else groovy
          s = p.read_text()
          if p.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              if 'desugar_jdk_libs' not in s:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              if 'coreLibraryDesugaringEnabled true' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              if 'desugar_jdk_libs' not in s:
                  s += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          p.write_text(s)
          print('Configured desugar dependency in', p)
          PY

      - name: Bundle verified Madinah Mushaf page boundaries
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/Mushaf-Learning/quran-text/main/metadata/pages.json \
            --output assets/quran-pages.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          pages = json.loads(Path('assets/quran-pages.json').read_text(encoding='utf-8'))
          if len(pages) != 604 or [x.get('page') for x in pages] != list(range(1, 605)):
              raise SystemExit('Invalid Madinah Mushaf page mapping')
          print('Verified Madinah Mushaf pages:', len(pages))
          PY

      - name: Bundle all 604 original full-resolution Mushaf page images
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.request import Request, urlopen

          output = Path('assets/mushaf_pages')
          output.mkdir(parents=True, exist_ok=True)
          base = 'https://raw.githubusercontent.com/Miftah-Fentaw/Quran_webp/main/png/'

          def download(page):
              request = Request(f'{base}{page}.png', headers={'User-Agent': 'NoorAlIslam-build/1.0'})
              with urlopen(request, timeout=60) as response:
                  data = response.read()
              if len(data) < 1000:
                  raise RuntimeError(f'Page {page} is unexpectedly small ({len(data)} bytes)')
              signatures = (bytes.fromhex('89504e470d0a1a0a'), b'RIFF', b'GIF8', bytes.fromhex('ffd8ff'))
              if not any(data.startswith(signature) for signature in signatures):
                  raise RuntimeError(f'Page {page} is not a recognized original image file')
              (output / f'{page}.png').write_bytes(data)
              return len(data)

          sizes = {}
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = {pool.submit(download, page): page for page in range(1, 605)}
              for future in as_completed(futures):
                  sizes[futures[future]] = future.result()

          files = list(output.glob('*.png'))
          if len(files) != 604:
              raise SystemExit(f'Expected 604 original page images, found {len(files)}')
          print(f'Bundled {len(files)} original full-resolution pages; total {sum(sizes.values()) / 1024 / 1024:.1f} MiB. No image conversion or compression performed.')
          PY

