name: Build Noor Al-Islam APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: noor-al-islam-android-build-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.nooralislam .

      - name: Enable Java API desugaring for scheduled notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')
          p = kts if kts.exists() else groovy
          s = p.read_text()
          if p.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              if 'desugar_jdk_libs' not in s:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              if 'coreLibraryDesugaringEnabled true' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              if 'desugar_jdk_libs' not in s:
                  s += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          p.write_text(s)
          print('Configured desugar dependency in', p)
          PY

      - name: Bundle verified Madinah Mushaf page boundaries
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/Mushaf-Learning/quran-text/main/metadata/pages.json \
            --output assets/quran-pages.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          pages = json.loads(Path('assets/quran-pages.json').read_text(encoding='utf-8'))
          if len(pages) != 604 or [x.get('page') for x in pages] != list(range(1, 605)):
              raise SystemExit('Invalid Madinah Mushaf page mapping')
          print('Verified Madinah Mushaf pages:', len(pages))
          PY

      - name: Bundle all 604 original full-resolution Mushaf page images
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.request import Request, urlopen

          output = Path('assets/mushaf_pages')
          output.mkdir(parents=True, exist_ok=True)
          base = 'https://raw.githubusercontent.com/Miftah-Fentaw/Quran_webp/main/png/'

          def download(page):
              request = Request(f'{base}{page}.png', headers={'User-Agent': 'NoorAlIslam-build/1.0'})
              with urlopen(request, timeout=60) as response:
                  data = response.read()
              if len(data) < 1000:
                  raise RuntimeError(f'Page {page} is unexpectedly small ({len(data)} bytes)')
              signatures = (bytes.fromhex('89504e470d0a1a0a'), b'RIFF', b'GIF8', bytes.fromhex('ffd8ff'))
              if not any(data.startswith(signature) for signature in signatures):
                  raise RuntimeError(f'Page {page} is not a recognized original image file')
              (output / f'{page}.png').write_bytes(data)
              return len(data)

          sizes = {}
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = {pool.submit(download, page): page for page in range(1, 605)}
              for future in as_completed(futures):
                  sizes[futures[future]] = future.result()

          files = list(output.glob('*.png'))
          if len(files) != 604:
              raise SystemExit(f'Expected 604 original page images, found {len(files)}')
          print(f'Bundled {len(files)} original full-resolution pages; total {sum(sizes.values()) / 1024 / 1024:.1f} MiB. No image conversion or compression performed.')
          PY

      - name: Bundle the complete verified Uthmani Quran text
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/nurekella/namaz-times-kz/main/quran/ar.txt \
            --output assets/quran-uthmani.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('assets/quran-uthmani.txt').read_text(encoding='utf-8')
          lines = text.splitlines()
          if len(lines) != 6236 or any('|' in line for line in lines):
              raise SystemExit(f'Invalid Quran asset: {len(lines)} lines')
          print('Verified bundled Quran:', len(lines), 'ayahs')
          PY

      - name: Configure Android permissions for prayer reminders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for permission in [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.INTERNET',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
          ]:
              if permission not in s:
                  tag = '<uses-permission android:name="{}"/>'.format(permission)
                  s = s.replace('<application', tag + '\n    <application', 1)
          receivers = '''
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receivers + '\n</application>', 1)
          p.write_text(s)
          PY

      - name: Bundle 1000 verified Sahih hadiths
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://github.com/Jaguar16/open-hadith-data/releases/download/v1.1.0/collections-json.zip \
            --output /tmp/open-hadith-data.zip
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          wanted = {'bukhari': [], 'muslim': []}
          with zipfile.ZipFile('/tmp/open-hadith-data.zip') as archive:
              for name in archive.namelist():
                  if not name.lower().endswith('.json'):
                      continue
                  try:
                      data = json.loads(archive.read(name))
                  except Exception:
                      continue
                  collection = (data.get('collection') or {}).get('id')
                  if collection not in wanted:
                      stem = Path(name).stem.lower()
                      collection = stem if stem in wanted else None
                  if collection not in wanted:
                      continue
                  records = []
                  for book in data.get('books', []):
                      records.extend(book.get('hadiths', []))
                  records.extend(data.get('hadiths', []))
                  if records and len(records) > len(wanted[collection]):
                      wanted[collection] = records

          output = []
          for collection, limit, arabic_name in [
              ('bukhari', 700, 'صحيح البخاري'),
              ('muslim', 300, 'صحيح مسلم'),
          ]:
              records = wanted[collection]
              usable = [h for h in records if (h.get('text_ar') or '').strip()]
              if len(usable) < limit:
                  raise SystemExit(f'Not enough Arabic hadiths in {collection}: {len(usable)}')
              for h in usable[:limit]:
                  number = str(h.get('hadith_number') or '')
                  output.append({
                      'reference': h.get('reference') or f'{arabic_name} {number}',
                      'text_ar': h['text_ar'].strip(),
                      'source': arabic_name,
                      'grade': h.get('grade_ar') or 'صحيح بالإدراج في الصحيح',
                      'url_source': h.get('url_source') or '',
                  })

          if len(output) != 1000:
              raise SystemExit(f'Expected exactly 1000 hadiths, got {len(output)}')
          Path('assets/hadiths-1000.json').write_text(
              json.dumps(output, ensure_ascii=False), encoding='utf-8')
          print('Bundled exactly', len(output), 'full Arabic Sahih hadiths.')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Check Dart code
        run: flutter analyze --no-fatal-infos lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release Android App Bundle
        run: flutter build appbundle --release

      - name: Upload Android release files
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-islam-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
