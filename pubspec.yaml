name: noor_alislam
description: موسوعة نور الإسلام
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  adhan: ^2.0.0+1
  geolocator: ^14.1.2
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  file_picker: ^13.4.0
  path_provider: ^2.1.5
  just_audio: ^0.10.6
  shared_preferences: ^2.5.5
  hijri_date: ^1.1.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/quran-uthmani.txt
    - assets/quran-pages.json
    - assets/hadiths-1000.json
    - assets/QURAN_SOURCE.txt

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/noor_icon.jpg"
  min_sdk_android: 21
